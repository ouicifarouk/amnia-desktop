[package]
name = "amnia-desktop"
version = "0.1.0"
description = "Tauri desktop app with Rust core, JS/Tailwind UI, Python AI sidecar"
authors = ["Farouk <fouici4@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "amnia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[features]
default = []
